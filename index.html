<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria Meow!</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
</head>

<body>
    <header>
        <h1>Pizzaria Meow! <img
        src="https://cdn.discordapp.com/emojis/1567296784454258769.gif?size=128&quality=lossless" alt=""></h1>
        <input type="text" placeholder="Pesquise aqui!" id="nomeProduto">
        <button id="botaoPesquisa">Pesquisar</button>
        <select id="filtrarProdutosPorOpcao">
            <option value="Todos">Todos</option>
            <option value="Peperroni">Peperroni</option>
            <option value="Calabresa">Calabresa</option>
            <option value="Frango com Catupiri">Frango/Catupiri</option>
            <option value="4 Queijos">4 Queijos</option>
            <option value="Camarão">Camarão</option>
            <option value="Portuguesa">Portuguesa</option>
            <option value="Carne">Carne</option>
        </select>
        <button id="buttonFuncionarios">Tela para Funcionarios</button>
        <button id="buttonUsuario">Volta para tela de usuario</button>
        <button id="buttonAdicionarProduto">Adicionar produto</button>
    </header>
    <main>
        <div id="funcionarios"><button id="sairDeFuncionarios">Sair</button></div>
        <div id="produtos"></div>
        <div id="estoque"></div>
        <div id="modalEditar">
            <div id="cardEditar">
                <label for="">Nome do produto:<input type="text" placeholder="Digite o novo nome do produto:" id="inputEditarNomeProduto"></label>
                <label for="">Quantidade em estoque:<input type="number" id="inputQuantidadeEstoque"></label>
                <button id="botaoConfirmarEdicao">Confirmar</button>
                <button id="botaoCancelarEdicao">Cancelar</button>
            </div>
        </div>
        <div id="modalAdicionarProduto">
            <div id="cardAdicionarProduto">
                <label for="">Nome do produto:<input type="text" id="inputCadastrarNomeProduto"></label>
                <label for="">Quantidade em estoque:<input type="number" id="inputCadastrarQuantidadeEstoque"></label>
                <button id="botaoCadastrarProduto">Cadastrar</button>
                <button id="botaoCancelar">Cancelar</button>
            </div>
        </div>
    </main>

</body>

</html>
